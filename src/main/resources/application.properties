# =============================================
# EcoVision - Configurações da Aplicação
# =============================================

# Nome da aplicação
spring.application.name=ecovision-backend

# Porta do servidor
server.port=8080

# =============================================
# Configuração do Banco de Dados H2 (em memória)
# =============================================
spring.datasource.url=jdbc:h2:mem:ecovisiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# Configuração do JPA/Hibernate
# =============================================
# create-drop: cria as tabelas ao iniciar e apaga ao encerrar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Carregar dados iniciais
spring.sql.init.mode=always
